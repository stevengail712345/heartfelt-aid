name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug: environment info
        run: |
          echo "Runner: $RUNNER_OS"
          node -v || true
          npm -v || true
          if command -v bun >/dev/null 2>&1; then bun --version || true; fi
          ls -la
          echo "--- package.json ---"
          cat package.json || true

      - name: Install dependencies (detect Bun or npm)
        run: |
          set -e
          if [ -f bun.lock ]; then
            echo "bun.lock detected — installing Bun and using bun install"
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun --version
            bun install
          else
            echo "No bun.lock — using npm install"
            npm install --prefer-offline --no-audit --progress=false
          fi

      - name: Debug: list node_modules / bun lock
        run: |
          echo "node_modules exists:"; ls -la node_modules || true
          echo "bun.lock exists:"; ls -la bun.lock || true

      - name: Build (verbose)
        run: |
          set -x
          if command -v bun >/dev/null 2>&1; then
            bun run build || npm run build
          else
            npm run build
          fi
        env:
          CI: true

      - name: Capture build log
        if: failure()
        run: |
          echo "--- Build failed; capturing env and logs ---"
          echo "Node:"; node -v || true
          echo "NPM:"; npm -v || true
          ls -la
          find . -maxdepth 3 -type f -name "*.log" -print -exec sed -n '1,200p' {} \; || true

      - name: Inspect build output
        run: |
          echo "Build directory listing:"
          ls -la dist || true
          echo "First lines of dist/index.html (if present):"
          head -n 40 dist/index.html || true

      - name: Prepare SPA Routing Fallback
        run: |
          cp dist/index.html dist/404.html || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
