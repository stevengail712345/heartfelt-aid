name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug: environment info
        run: |
          echo "Runner: $RUNNER_OS"
          node -v || true
          npm -v || true
          if command -v bun >/dev/null 2>&1; then bun --version || true; fi
          ls -la
          echo "--- package.json ---"
          cat package.json || true

      - name: Install dependencies (detect Bun or npm)
        run: |
          set -e
          # Prefer using bun when a bun.lock file is present
          if [ -f bun.lock ]; then
            echo "bun.lock detected — installing Bun and using bun install"
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun --version || true
            # bun install is typically much faster; fall back to npm if it fails
            bun install || npm install --prefer-offline --no-audit --progress=false
          else
            echo "No bun.lock — using npm install"
            npm ci --prefer-offline --no-audit --progress=false || npm install --prefer-offline --no-audit --progress=false
          fi

      - name: Debug: list node_modules
        run: |
          echo "node_modules exists:"; ls -la node_modules || true

      - name: Build (detect Bun or npm, verbose)
        run: |
          set -euo pipefail
          set -x
          # If bun is available, prefer bun run build, but fall back to npm
          if command -v bun >/dev/null 2>&1; then
            echo "Using bun to run build"
            bun run build || { echo "bun build failed, trying npm"; npm run build; }
          else
            echo "Using npm to run build"
            npm run build
          fi
        env:
          CI: true
          PRERENDER: "false"
          DISABLE_PRERENDER: "true"
          NITRO_PRE_RENDER: "false"
          TANSTACK_START_DISABLE_PRERENDER: "true"

      - name: Post-build: normalize output to dist
        run: |
          set -e
          echo "Normalizing build output to ./dist for Pages upload"
          if [ -d ".output/public" ]; then
            echo ".output/public detected — copying to dist"
            rm -rf dist
            mkdir -p dist
            cp -a .output/public/. dist/ || true
          elif [ -d "dist" ]; then
            echo "dist already exists — leaving as-is"
          else
            echo "No build output found (.output/public or dist)" && ls -la || true
            exit 1
          fi

      - name: Post-build: copy server output and create server shim
        run: |
          set -e
          if [ -d ".output/server" ]; then
            echo ".output/server detected — copying server files to dist/server"
            rm -rf dist/server
            mkdir -p dist/server
            cp -a .output/server/. dist/server/ || true
            echo "Creating dist/server/server.js shim to satisfy preview plugin"
            cat > dist/server/server.js <<'JS'
import './index.mjs';
export * from './index.mjs';
JS
          else
            echo "No .output/server detected — skipping server copy"
          fi

      - name: Inspect build output
        run: |
          echo "Build directory listing:"
          ls -la dist || true
          echo "First lines of dist/index.html (if present):"
          head -n 40 dist/index.html || true
          echo "Server directory listing (if present):"
          ls -la dist/server || true

      - name: Prepare SPA Routing Fallback
        run: |
          cp dist/index.html dist/404.html || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
