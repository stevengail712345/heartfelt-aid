name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Debug: environment info
        run: |
          echo "Runner: $RUNNER_OS"
          node -v || true
          npm -v || true
          if command -v bun >/dev/null 2>&1; then bun --version || true; fi
          ls -la
          echo "--- package.json ---"
          cat package.json || true

      - name: Install dependencies (use npm)
        run: |
          set -e
          echo "Forcing npm install for CI reproducibility"
          npm ci --prefer-offline --no-audit --progress=false || npm install --prefer-offline --no-audit --progress=false

      - name: Debug: list node_modules
        run: |
          echo "node_modules exists:"; ls -la node_modules || true

      - name: Build (verbose, disable prerender via env)
        run: |
          set -x
          npm run build
        env:
          CI: true
          PRERENDER: "false"
          DISABLE_PRERENDER: "true"
          NITRO_PRE_RENDER: "false"
          TANSTACK_START_DISABLE_PRERENDER: "true"

      - name: Post-build: normalize output to dist
        run: |
          set -e
          echo "Normalizing build output to ./dist for Pages upload"
          if [ -d ".output/public" ]; then
            echo ".output/public detected — copying to dist"
            rm -rf dist
            mkdir -p dist
            cp -a .output/public/. dist/ || true
          elif [ -d "dist" ]; then
            echo "dist already exists — leaving as-is"
          else
            echo "No build output found (.output/public or dist)" && ls -la || true
            exit 1
          fi

      - name: Inspect build output
        run: |
          echo "Build directory listing:"
          ls -la dist || true
          echo "First lines of dist/index.html (if present):"
          head -n 40 dist/index.html || true

      - name: Prepare SPA Routing Fallback
        run: |
          cp dist/index.html dist/404.html || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
