name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (detect Bun or npm)
        run: |
          set -e
          if [ -f bun.lock ]; then
            echo "bun.lock detected — installing Bun and using bun install"
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun --version
            bun install
          else
            echo "No bun.lock — using npm install"
            npm install
          fi

      - name: Build
        run: |
          # Try package.json build script first; if using bun, use bun run
          if command -v bun >/dev/null 2>&1; then
            bun run build || npm run build
          else
            npm run build
          fi

      - name: Inspect build output
        run: |
          echo "Build directory listing:"
          ls -la dist || true
          echo "First lines of dist/index.html (if present):"
          head -n 40 dist/index.html || true

      - name: Prepare SPA Routing Fallback
        run: |
          cp dist/index.html dist/404.html || true
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
